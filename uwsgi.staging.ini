[uwsgi]
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Módulo Django & Configuración Staging (Load Testing)
; POR QUÉ: Replica la topología de procesos y memoria de producción
; pero cargando explícitamente settings/staging.py sin SSL redirect ni credenciales reales.
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
chdir           = /app
module          = web_bulonera.wsgi:application
env             = DJANGO_SETTINGS_MODULE=web_bulonera.settings.staging

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Socket HTTP (Docker mapea a 127.0.0.1:8002 en el host)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
http-socket     = 0.0.0.0:8002
chmod-socket    = 660
umask           = 002

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Procesos (Replica exacta de producción: 6 slots totales)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
master          = true
processes       = 3
threads         = 2
enable-threads  = true
thunder-lock    = true
single-interpreter = true

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Gestión de recursos (Mismas salvaguardas de producción)
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
harakiri                = 120
harakiri-verbose        = true
max-requests            = 2000
max-worker-lifetime     = 3600
reload-on-rss           = 256
buffer-size             = 65536
post-buffering          = 16384
max-fd                  = 2048

reload-mercy            = 60
worker-reload-mercy     = 60

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Logs de Staging
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
logto           = /app/logs/uwsgi_staging.log
log-maxsize     = 10485760  ; 10MB
log-master      = true
log-reopen      = true
log-4xx         = true
log-5xx         = true
log-date        = true
log-slow        = true
log-ioerror     = true
memory-report   = true

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Naming e identificación de procesos
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
auto-procname   = true
procname-prefix = staging-web-

; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; Limpieza y estabilidad de red
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
vacuum          = true
die-on-term     = true
no-orphans      = true

ignore-sigpipe          = true
ignore-write-errors     = true
disable-write-exception = true
